# inventaris.ankdev.id — aplikasi Next.js di 127.0.0.1:3030 (+ contoh format cetak statis)
server {
    server_name inventaris.ankdev.id;
    server_tokens off;

    access_log /var/log/nginx/inventaris.access.log;
    error_log  /var/log/nginx/inventaris.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Unggahan logo (2 x 1 MB per form) + overhead multipart
    client_max_body_size 4m;

    location /contoh-format/ {
        alias /var/www/inventaris/docs/format/;
        index index.html;
        expires -1;
        location ~ \.(py|md)$ { return 404; }
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3030;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (notifikasi) tidak boleh di-buffer
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/inventaris.ankdev.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/inventaris.ankdev.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = inventaris.ankdev.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name inventaris.ankdev.id;
    return 404; # managed by Certbot
}
